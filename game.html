<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            touch-action: none;
        }

        .game-wrapper {
            background: #16213e;
            padding: 20px 20px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 2px solid #0f3460;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 12px 6px;
            color: #e0e0e0;
        }

        .game-header .title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f9a825, #ff6f00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-header .score-label {
            background: #0f3460;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid #1a4a7a;
        }

        .game-header .score-label span {
            color: #ffd54f;
            font-size: 1.3rem;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #4fc3f7;
            border-radius: 16px;
            border: 3px solid #0f3460;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 400 / 600;
            touch-action: none;
            cursor: pointer;
        }

        .game-footer {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .btn {
            background: #0f3460;
            border: none;
            color: white;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #1a4a7a;
        }

        .btn:hover {
            background: #1a4a7a;
            transform: scale(1.03);
        }

        .btn-restart {
            background: #e65100;
            border-color: #bf360c;
        }

        .btn-restart:hover {
            background: #bf360c;
        }

        .hint {
            color: #78909c;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 12px 12px 16px;
                border-radius: 20px;
                width: 100%;
                margin: 0 10px;
            }
            .game-header .title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- 顶部栏 -->
    <div class="game-header">
        <span class="title">🍭 棉花糖飞行</span>
        <span class="score-label">🏆 <span id="scoreDisplay">0</span></span>
    </div>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- 底部按钮 -->
    <div class="game-footer">
        <button class="btn" id="startBtn">🚀 开始</button>
        <button class="btn btn-restart" id="restartBtn">🔄 重来</button>
    </div>
    <div class="hint">点击屏幕 / 按空格 让小鸟飞起来</div>
</div>

<script>
    // ============================================================
    //  🍭 棉花糖 Flappy Bird · 安卓6.0 彩蛋风格
    //  致敬经典，简单又好上瘾！
    // ============================================================

    // ---------- DOM ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');

    // ---------- 固定尺寸 ----------
    const W = 400;
    const H = 600;
    canvas.width = W;
    canvas.height = H;

    // ---------- 游戏常量 ----------
    const GRAVITY = 0.4;
    const JUMP_FORCE = -7.5;
    const PIPE_WIDTH = 52;
    const PIPE_GAP = 160;          // 缝隙高度
    const PIPE_SPEED = 2.5;
    const PIPE_SPAWN_INTERVAL = 95; // 帧数间隔

    // ---------- 游戏状态 ----------
    let bird = { x: 70, y: 280, vy: 0, radius: 16 };
    let pipes = [];
    let score = 0;
    let gameState = 'idle';   // 'idle' | 'playing' | 'gameover'
    let frameCount = 0;
    let animationId = null;
    let highScore = parseInt(localStorage.getItem('flappyHighScore')) || 0;

    // ---------- 重置游戏 ----------
    function resetGame() {
        bird = {
            x: 70,
            y: 280,
            vy: 0,
            radius: 16
        };
        pipes = [];
        score = 0;
        frameCount = 0;
        gameState = 'idle';
        updateScoreDisplay();
        drawCanvas();
    }

    // ---------- 开始游戏 ----------
    function startGame() {
        resetGame();
        gameState = 'playing';
        // 给一个初始跳跃，让鸟先飞起来
        bird.vy = JUMP_FORCE * 0.8;
        if (animationId === null) {
            gameLoop();
        }
    }

    // ---------- 跳跃 ----------
    function jump() {
        if (gameState === 'idle') {
            startGame();
            return;
        }
        if (gameState === 'playing') {
            bird.vy = JUMP_FORCE;
        }
        // gameover 时点击无效（可用重启按钮）
    }

    // ---------- 生成管道 ----------
    function spawnPipe() {
        const minY = 60;
        const maxY = H - PIPE_GAP - 60;
        const topHeight = Math.random() * (maxY - minY) + minY;
        pipes.push({
            x: W + 20,
            topHeight: topHeight,
            scored: false
        });
    }

    // ---------- 更新逻辑 ----------
    function update() {
        if (gameState !== 'playing') return;

        // ----- 物理 -----
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        // 天花板 / 地板碰撞（直接判死）
        if (bird.y - bird.radius < 0) {
            bird.y = bird.radius;
            bird.vy = 0;
        }
        if (bird.y + bird.radius > H) {
            gameOver();
            return;
        }

        // ----- 管道移动 -----
        for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            p.x -= PIPE_SPEED;

            // 移出屏幕的移除
            if (p.x + PIPE_WIDTH < 0) {
                pipes.splice(i, 1);
                continue;
            }

            // 得分检测（通过管道时）
            if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
                p.scored = true;
                score++;
                updateScoreDisplay();
                // 每得 5 分增加一点难度（加速）
                if (score % 5 === 0 && PIPE_SPEED < 5) {
                    // 不能直接改常量，用变量存
                }
            }

            // 碰撞检测（鸟 vs 管道）
            const birdLeft = bird.x - bird.radius;
            const birdRight = bird.x + bird.radius;
            const birdTop = bird.y - bird.radius;
            const birdBottom = bird.y + bird.radius;

            const pipeLeft = p.x;
            const pipeRight = p.x + PIPE_WIDTH;
            const gapTop = p.topHeight;
            const gapBottom = p.topHeight + PIPE_GAP;

            // 水平有重叠 且 (垂直撞上管或撞下管)
            if (birdRight > pipeLeft && birdLeft < pipeRight) {
                if (birdTop < gapTop || birdBottom > gapBottom) {
                    gameOver();
                    return;
                }
            }
        }

        // ----- 生成新管道 -----
        frameCount++;
        const spawnRate = Math.max(70, PIPE_SPAWN_INTERVAL - Math.floor(score / 8));
        if (frameCount % spawnRate === 0) {
            spawnPipe();
        }

        // 更新最高分
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('flappyHighScore', String(highScore));
        }
    }

    // ---------- 游戏结束 ----------
    function gameOver() {
        if (gameState === 'gameover') return;
        gameState = 'gameover';
        // 保存最高分
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('flappyHighScore', String(highScore));
        }
        drawCanvas();
    }

    // ---------- 绘制 ----------
    function drawCanvas() {
        ctx.clearRect(0, 0, W, H);

        // ----- 天空渐变 -----
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, '#4fc3f7');
        skyGrad.addColorStop(0.65, '#81d4fa');
        skyGrad.addColorStop(1, '#b3e5fc');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // ----- 云朵（装饰） -----
        drawCloud(50, 80, 40);
        drawCloud(280, 50, 30);
        drawCloud(180, 130, 35);

        // ----- 地面 -----
        ctx.fillStyle = '#8bc34a';
        ctx.fillRect(0, H - 16, W, 16);
        ctx.fillStyle = '#689f38';
        ctx.fillRect(0, H - 4, W, 4);

        // ----- 管道 -----
        pipes.forEach(p => {
            const x = p.x;
            const topH = p.topHeight;
            const bottomY = topH + PIPE_GAP;

            // 上管道（带帽檐）
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(x, 0, PIPE_WIDTH, topH);
            // 帽檐
            ctx.fillStyle = '#388e3c';
            ctx.fillRect(x - 6, topH - 24, PIPE_WIDTH + 12, 24);
            ctx.fillStyle = '#1b5e20';
            ctx.fillRect(x - 4, topH - 4, PIPE_WIDTH + 8, 6);

            // 下管道
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(x, bottomY, PIPE_WIDTH, H - bottomY);
            ctx.fillStyle = '#388e3c';
            ctx.fillRect(x - 6, bottomY, PIPE_WIDTH + 12, 24);
            ctx.fillStyle = '#1b5e20';
            ctx.fillRect(x - 4, bottomY + 18, PIPE_WIDTH + 8, 6);

            // 棉花糖装饰（彩蛋风格）
            ctx.shadowColor = 'rgba(255,255,255,0.3)';
            ctx.shadowBlur = 8;
            // 上管棉花糖
            for (let i = 0; i < 3; i++) {
                const cy = 30 + i * 28 + (x % 20);
                if (cy < topH - 20) {
                    ctx.beginPath();
                    ctx.arc(x + PIPE_WIDTH / 2, cy, 14 - i * 2, 0, Math.PI * 2);
                    ctx.fillStyle = ['#f9a825', '#ff8f00', '#ff6f00'][i % 3];
                    ctx.fill();
                }
            }
            // 下管棉花糖
            for (let i = 0; i < 3; i++) {
                const cy = bottomY + 30 + i * 28 + (x % 20);
                if (cy < H - 20) {
                    ctx.beginPath();
                    ctx.arc(x + PIPE_WIDTH / 2, cy, 14 - i * 2, 0, Math.PI * 2);
                    ctx.fillStyle = ['#f9a825', '#ff8f00', '#ff6f00'][i % 3];
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;
        });

        // ----- 小鸟（安卓机器人风格） -----
        const bx = bird.x;
        const by = bird.y;
        const r = bird.radius;

        // 身体（圆形 + 天线）
        ctx.shadowColor = 'rgba(76, 175, 80, 0.5)';
        ctx.shadowBlur = 18;

        // 身体主圆
        const grad = ctx.createRadialGradient(bx - 4, by - 4, 4, bx, by, r + 4);
        grad.addColorStop(0, '#a5d6a7');
        grad.addColorStop(0.6, '#66bb6a');
        grad.addColorStop(1, '#2e7d32');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fill();

        // 眼睛（白色）
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(bx - 7, by - 5, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx + 7, by - 5, 6, 0, Math.PI * 2);
        ctx.fill();

        // 瞳孔（黑色）
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(bx - 5, by - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx + 9, by - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        // 嘴巴（微笑）
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bx, by + 2, 6, 0.1, Math.PI - 0.1);
        ctx.stroke();

        // 天线（安卓特色）
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(bx - 10, by - r + 2);
        ctx.lineTo(bx - 14, by - r - 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx + 10, by - r + 2);
        ctx.lineTo(bx + 14, by - r - 12);
        ctx.stroke();
        // 天线球
        ctx.fillStyle = '#66bb6a';
        ctx.beginPath();
        ctx.arc(bx - 14, by - r - 12, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx + 14, by - r - 12, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;

        // ----- 游戏状态文字 -----
        if (gameState === 'idle') {
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white';
            ctx.font = 'bold 34px system-ui, sans-serif';
            ctx.fillText('🍭 点击开始', W / 2, H / 2 - 30);
            ctx.font = '18px system-ui';
            ctx.fillStyle = '#e0e0e0';
            ctx.fillText('点屏幕 / 按空格起飞', W / 2, H / 2 + 30);
            if (highScore > 0) {
                ctx.fillStyle = '#ffd54f';
                ctx.font = '16px system-ui';
                ctx.fillText('🏆 最高分: ' + highScore, W / 2, H / 2 + 80);
            }
        }

        if (gameState === 'gameover') {
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ff8a80';
            ctx.font = 'bold 38px system-ui, sans-serif';
            ctx.fillText('💥 游戏结束', W / 2, H / 2 - 50);
            ctx.fillStyle = 'white';
            ctx.font = '24px system-ui';
            ctx.fillText('得分: ' + score, W / 2, H / 2 + 20);
            ctx.fillStyle = '#ffd54f';
            ctx.font = '18px system-ui';
            ctx.fillText('🏆 最高: ' + highScore, W / 2, H / 2 + 70);
            ctx.fillStyle = '#b0bec5';
            ctx.font = '16px system-ui';
            ctx.fillText('点击「重来」再来一局', W / 2, H / 2 + 120);
        }

        // 实时分数显示（游戏中）
        if (gameState === 'playing') {
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.font = 'bold 52px system-ui, sans-serif';
            ctx.fillText(score, W - 20, 14);
        }
    }

    // ---------- 画云（装饰） ----------
    function drawCloud(x, y, size) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(x, y, size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + size * 0.5, y - size * 0.2, size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + size, y + size * 0.1, size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + size * 0.4, y + size * 0.2, size * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // ---------- 更新分数显示 ----------
    function updateScoreDisplay() {
        scoreSpan.textContent = score;
    }

    // ---------- 游戏主循环 ----------
    function gameLoop() {
        update();
        drawCanvas();
        animationId = requestAnimationFrame(gameLoop);
    }

    // ---------- 事件绑定 ----------
    // 点击画布 = 跳跃 / 开始
    canvas.addEventListener('click', (e) => {
        e.preventDefault();
        jump();
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        jump();
    });

    // 键盘空格
    document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    // 开始按钮
    document.getElementById('startBtn').addEventListener('click', () => {
        startGame();
    });

    // 重启按钮
    document.getElementById('restartBtn').addEventListener('click', () => {
        resetGame();
        // 如果游戏正在运行，保持循环
        if (gameState === 'playing' || gameState === 'gameover') {
            gameState = 'idle';
        }
        drawCanvas();
    });

    // ---------- 初始化 ----------
    resetGame();
    drawCanvas();

    console.log('🍭 棉花糖 Flappy 已加载！');
    console.log('🏆 最高分:', highScore);
</script>

</body>
</html>
